[package]
name = "metaxy"
version = "0.1.0"
edition = "2021"
description = "Relay server for eidos multiplayer sessions"
license = "MIT"

[lib]
name = "metaxy"
path = "src/lib.rs"

[[bin]]
name = "metaxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
ring = "0.17"
base64 = "0.22"
webpki-roots = "1"
# The world generator (world sessions). Pinned to one commit: a stored
# world names the generator version that made it (docs/SPEC.md, Part C).
# serde_json must keep its default features here: a feature such as
# preserve_order would change the generated worlds and their hashes.
arkh-gen = { git = "https://github.com/Project-Holon/arkhipelagos", rev = "758617a8fec9999f605d5827cb1cde5158ce7d70" }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[profile.release]
lto = true

# Generation is slow without optimisation; tests make real worlds.
[profile.dev.package.arkh-gen]
opt-level = 3
