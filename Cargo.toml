[package]
name = "metaxy"
version = "0.1.0"
edition = "2021"
description = "Relay server for eidos multiplayer sessions"
license = "MIT"

[lib]
name = "metaxy"
path = "src/lib.rs"

[[bin]]
name = "metaxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"

[profile.release]
lto = true
